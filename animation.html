<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            animation-name:myAnimation;
            animation-duration: 20s;
        }
        @keyframes myAnimation{
            0%{background-color: red; left: 0px;top: 0px;}
            25%{background-color: yellow;left: 200px;top:0px;}
            50%{background-color: rgb(83, 64, 131);left: 0px;top:200px;}
            75%{background-color: rgb(184, 138, 164);left: 0px;top:200px;}
            100%{background-color: rgb(80, 187, 137);left: 0px;top:0px;} 
        }
            



            
    </style>
</head>
<body>
    <h1> CSS Animation- thêm animation cho web</h1>
    <div class="box"></div>
</body>
</html>
