<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            .a{
            width:120px;
            height: 50px;
            background-color: yellow;
            transform:rotate(20deg);
        }
        .b{
            width:120px;
            height: 50px;
            background-color: yellow;
            transform:skewY(20deg);
        }
      
        .c{
            width:120px;
            height: 50px;
            background-color: yellow;
            transform:scaley(1.5);
        }
        .d{
            width:120px;
            height: 50px;
            background-color: yellow;
            transform:translateX(100%);
        }
    </style>
</head>
<body>
    <h2> transform:rotate(20deg)</h2>
    <div class="a">Rotate-xoay</div>

    <h2> transform:SkewY(20deg)</h2>
    <div class="b">SkewY-nghieng</div>

    <h2> transform:scaley(1.5)</h2>
    <div class="c">scaley-phóng to</div>

    <h2> transform:translateX(100%)</h2>
    <div class="d"> translateX: di chuyen vi tri </div>
    
    
</body>
</html>
